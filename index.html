<script>
const T={inf:[10,12,'Infantry'],rng:[14,6,'Archers'],cav:[18,8,'Cavalry'],sge:[25,3,'Siege'],eli:[30,25,'Elite Guard'],fan:[50,40,'Dragonkin']};
const TC={inf:1,rng:2,cav:3,sge:5,eli:8,fan:15};
const R=['food','wood','stone','ore','gold'],RI={food:'🌾',wood:'🪵',stone:'🪨',ore:'⛏',gold:'🪙'};
const B={castle:'Castle Keep',barracks:'Barracks',farm:'Farm',mine:'Mine',wall:'Walls',tower:'Towers'};
const F={Wedge:[1.2,.9],Line:[1,1.1],Shield:[.9,1.25]};
const W=3000,KC=[[500,500,'#c44'],[2400,600,'#48c'],[1500,1500,'#8a4'],[600,2400,'#a6c'],[2400,2400,'#ca4']];
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n);
let S,cam={x:0,y:0,z:.5},sel=null,feats=[],pct=100,fm='Wedge',spd=1;
function rnd(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function fresh(){S={res:{food:500,wood:500,stone:500,ore:500,gold:500},b:{castle:1,barracks:1,farm:1,mine:1,wall:1,tower:1},army:{inf:100,rng:50,cav:20,sge:5,eli:0,fan:0},lost:{},hist:[],conq:0,sand:true,free:true,seed:7,next:1,castles:[],mode:'sandbox',nm:0,kn:'Aurelia',city:{}};gen(300)}
const P1=['Iron','Storm','Raven','Ash','Gold','Frost','Thorn','Ember','Grey','Wolf','Dusk','Oak'],P2=['hold','keep','crag','watch','fall','spire','gate','reach','moor','haven'],RU=['Aldric','Brenna','Corvan','Dara','Eldrin','Fenna','Gorm','Hild','Isolde','Joren','Kael','Lysa'],TI=['Warlord','Queen','Baron','Duke','Archmage','Thane'];
function mk(lv){const r=rnd(S.seed=(S.seed*31+S.next*7919+13)>>>0);let x,y;for(let i=0;i<20;i++){x=100+r()*(W-200);y=100+r()*(W-200);if(Math.hypot(x-W/2,y-W/2)>150)break}
lv=lv||1+Math.floor(r()*r()*30);const sc=Math.pow(1.35,lv)*20,tr={};let k=0,d=1e9;KC.forEach((c,i)=>{const e=Math.hypot(x-c[0],y-c[1]);if(e<d){d=e;k=i}});
for(const t in T)tr[t]=Math.floor(sc*(t=='inf'?1:t=='rng'?.6:t=='cav'?.4:t=='sge'?.15:t=='eli'?.1*(lv>5):.03*(lv>12))*(.7+r()*.6));
const fo=['Wedge','Line','Shield'][Math.floor(r()*3)];const c={id:S.next++,name:P1[Math.floor(r()*12)]+P2[Math.floor(r()*10)]+' '+['I','II','III'][Math.floor(r()*3)],ruler:TI[Math.floor(r()*6)]+' '+RU[Math.floor(r()*12)],lv,x,y,k,tr,fo,hist:[],st:0,orig:null};c.orig={...tr};c.pw=pow(c);return c}
function pow(c){let a=0,d=0;for(const t in c.tr){a+=c.tr[t]*T[t][0];d+=c.tr[t]*T[t][1]}return Math.floor((a+d)/2*(1+c.lv*.05))}
function gen(n){for(let i=0;i<n;i++)S.castles.push(mk())}
function save(){try{localStorage.setItem('ce1',JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem('ce1');if(j){S=JSON.parse(j);return true}}catch(e){}return false}
if(!load())fresh();S.kn=S.kn||'Aurelia';S.city=S.city||{};S.sand=true;S.free=true;S.camp=S.camp||{ch:0};S.es=S.es||0;S.best=S.best||0;S.mode=S.mode||'sandbox';S.v3=true;
{const r=rnd(5);for(let i=0;i<500;i++)feats.push([r()*W,r()*W,['m','f','f','p'][Math.floor(r()*4)]])}
cam.x=W/2;cam.y=W/2;
function tab(n){document.querySelectorAll('.pg').forEach(e=>e.classList.remove('on'));document.getElementById('p-'+n).classList.add('on');if(n=='map'){resize();mSwitch()}ui();if(n=='k')kEnter();else cancelAnimationFrame(craf)}
function topBar(){document.getElementById('top').innerHTML=`<span>👑 ${S.kn||'Aurelia'}</span><span>👥 ${fmt(pop())}</span><span>⚔ ${fmt(tot())} troops</span><span>🔥 ${S.conq} castles burned</span>`}
function tot(){return Object.values(S.army).reduce((a,b)=>a+b,0)}
function cost(t,n){return TC[t]*n}
function can(c){return S.sand||!S.free===false&&0||S.free||R.every(r=>S.res[r]>=(c[r]||0))}
function build(k){const lv=S.b[k],c=lv*100;if(!S.sand&&!S.free){if(S.res.gold<c||S.res.stone<c/2)return alert('Not enough gold/stone');S.res.gold-=c;S.res.stone-=c/2}S.b[k]++;ui();save()}
function train(t,n){n=Math.floor(+n);if(!(n>0))return;if(S.mode=='campaign'&&UNL[t]>S.camp.ch){toast('🔒 '+T[t][2]+' unlocks after chapter '+UNL[t]);return}if(!S.sand&&!S.free){const c=cost(t,n);if(S.res.gold<c)return alert('Need '+fmt(c)+' gold');S.res.gold-=c}S.army[t]=(S.army[t]||0)+n;ui();save()}
function heal(){for(const t in S.lost)S.army[t]=(S.army[t]||0)+S.lost[t];S.lost={};ui();save()}
function collect(){const m=S.b.farm+S.b.mine+cnt('farm')+cnt('mine');R.forEach(r=>S.res[r]+=m*200*(r=='gold'?2:1));ui();save()}
function ui(){topBar();
document.getElementById('ku').innerHTML=`<h3>Kingdom</h3><div class="card">Castle level ${S.b.castle} · Power ${fmt(myPow())} · Conquered ${S.conq}</div>`+Object.keys(B).map(k=>`<div class="card"><b>${B[k]}</b> Lv ${S.b[k]} <small>${{castle:'+5% army strength per level',barracks:'+4% attack',farm:'+food income',mine:'+ore/gold income',wall:'+10% defence (yours & vs. none)',tower:'+3% attack as support fire'}[k]}</small><br><button onclick="build('${k}')">Upgrade ${S.sand||S.free?'(free)':'('+S.b[k]*100+'🪙)'}</button><button onclick="S.b['${k}']+=9;ui();save()">+10</button></div>`).join('');
document.getElementById('p-s').innerHTML=`<h3>Menu</h3>${modeCard()}${lbCard()}<div class="card"><button onclick="gen(1000);save();draw();alert('+1000 castles ('+S.castles.length+' total)')">Generate 1000 castles</button><button onclick="S.castles=[];S.next=1;gen(300);save();draw()">Regenerate world</button><button onclick="endless()">Endless: spawn tougher castle</button></div><div class="card"><button onclick="save();alert('Saved')">Save now</button><button onclick="exp()">Export</button><button onclick="imp()">Import</button><button onclick="if(confirm('Delete ALL progress?')){localStorage.removeItem('ce1');fresh();ui();draw()}">Delete save</button><br><textarea id="io" style="width:100%;height:60px;background:#120d0a;color:#fff;display:none"></textarea></div><small>Campaign mode & real-time resource ticking are not built yet. Auto-saves after every action.</small>`;kd()}
function exp(){const t=document.getElementById('io');t.style.display='block';t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));t.select()}
function imp(){const t=document.getElementById('io');if(t.style.display=='none'){t.style.display='block';t.value='';return alert('Paste the save code, then press Import again')}try{S=JSON.parse(decodeURIComponent(escape(atob(t.value.trim()))));save();ui();draw();alert('Imported')}catch(e){alert('Invalid save')}}
function myPow(){return Math.floor(Object.keys(T).reduce((a,t)=>a+(S.army[t]||0)*(T[t][0]+T[t][1])/2,0)*(1+S.b.castle*.05))}
/* MAP */
const cv=document.getElementById('map');let cx=cv.getContext('2d');const mcx=cx;let drag=null;
function resize(){const r=cv.parentElement.getBoundingClientRect();cv.width=r.width;cv.height=r.height;draw()}
addEventListener('resize',resize);
function zoom(f){if(S.v3&&mR){my.dst=Math.min(140,Math.max(12,my.dst/f));return}cam.z=Math.min(2,Math.max(.15,cam.z*f));draw()}
cv.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9)};
const cpt=new Map();let cpg=null;
cv.onpointerdown=e=>{cpt.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId);if(cpt.size==1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,m:0};else{drag=null;const a=[...cpt.values()];cpg={d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1,z:cam.z}}};
cv.onpointermove=e=>{if(!cpt.has(e.pointerId))return;cpt.set(e.pointerId,[e.clientX,e.clientY]);if(cpt.size>=2&&cpg){const a=[...cpt.values()];cam.z=Math.min(2,Math.max(.15,cpg.z*Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])/cpg.d));draw();return}if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m=Math.max(drag.m,Math.abs(dx)+Math.abs(dy));cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;draw()};
cv.onpointerup=cv.onpointercancel=e=>{cpt.delete(e.pointerId);if(drag&&drag.m<8&&cpt.size==0&&e.type=='pointerup')pick(e);drag=null;if(cpt.size<2)cpg=null};
const sx=x=>(x-cam.x)*cam.z+cv.width/2,sy=y=>(y-cam.y)*cam.z+cv.height/2;
function pick(e){const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left-cv.width/2)/cam.z+cam.x,my=(e.clientY-r.top-cv.height/2)/cam.z+cam.y;let best=null,bd=(30/cam.z)**2;
for(const c of S.castles){const d=(c.x-mx)**2+(c.y-my)**2;if(d<bd){bd=d;best=c}}
if(Math.hypot(mx-W/2,my-W/2)<40/cam.z){sel=null;info(null);tab('k');return}sel=best;info(best);draw()}
function mini(){const m=document.getElementById('mm'),g=m.getContext('2d'),k=96/W;g.fillStyle='#294a22';g.fillRect(0,0,96,96);KC.forEach(c=>{g.fillStyle=c[2]+'66';g.beginPath();g.arc(c[0]*k,c[1]*k,18,0,7);g.fill()});S.castles.forEach(c=>{g.fillStyle=c.st?'#222':KC[c.k][2];g.fillRect(c.x*k,c.y*k,2,2)});g.fillStyle='#4a8cff';g.fillRect(W/2*k-2,W/2*k-2,5,5);g.strokeStyle='#fff';g.strokeRect((cam.x-cv.width/2/cam.z)*k,(cam.y-cv.height/2/cam.z)*k,cv.width/cam.z*k,cv.height/cam.z*k)}
document.getElementById('mm').onpointerdown=e=>{const r=e.target.getBoundingClientRect();cam.x=(e.clientX-r.left)/96*W;cam.y=(e.clientY-r.top)/96*W;my.x=cam.x/20;my.z=cam.y/20;draw()};
function draw(){mini();if(S.v3&&mR){dirtyM=1;mStart();return}const w=cv.width,h=cv.height;if(!w)return;cx.fillStyle='#4f7a38';cx.fillRect(0,0,w,h);
